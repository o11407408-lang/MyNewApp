name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Flutter manually
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 -b stable _flutter

      - name: Add Flutter to PATH
        run: echo "$PWD/_flutter/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: flutter pub get

      - name: Create Android platform files if missing
        run: flutter create . --platforms=android --org com.yakopluymaratkrutoi

      - name: Change package name
        run: flutter pub run change_app_package_name:main com.yakopluymaratkrutoi.app

      - name: Я Коплю
        run: sed -i 's/android:label="[^"]*"/android:label="Я Коплю"/g' android/app/src/main/AndroidManifest.xml

      - name: Fix compileSdk for all dependencies
        run: |
          echo "subprojects { afterEvaluate { project -> if (project.hasProperty('android')) { project.android { compileSdkVersion 36 } } } }" >> android/build.gradle

      - name: Install launcher icons package
        run: flutter pub add flutter_launcher_icons || true

      - name: Generate app icon
        run: dart run flutter_launcher_icons:main

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK via Gradle
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk
